name: Build FLIPFALL APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'FlippFall-updated.zip'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Extract project
        run: |
          unzip -q FlippFall-updated.zip -d project
          test -f project/package.json
          test -f project/apk/android/gradlew
      - name: Install dependencies
        working-directory: project
        run: npm ci
      - name: Install Capacitor
        working-directory: project/apk
        run: npm ci
      - name: Build web game
        working-directory: project
        run: npx vite build --config vite.apk.config.ts
      - name: Sync Android
        working-directory: project/apk
        run: npx cap sync android
      - name: Build APK
        working-directory: project/apk/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FLIPFALL-APK
          path: project/apk/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
