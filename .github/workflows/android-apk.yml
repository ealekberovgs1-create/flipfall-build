
name: Build FLIPFALL APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'FlippFall-updated.zip'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Check Java
        run: |
          java -version
          javac -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Extract project
        run: |
          unzip -q FlippFall-updated.zip -d project
          test -f project/package.json
          test -f project/apk/android/gradlew

      - name: Install dependencies
        working-directory: project
        run: npm install

      - name: Install Capacitor
        working-directory: project/apk
        run: npm install

      - name: Build web game
        working-directory: project
        run: npx vite build --config vite.apk.config.ts

      - name: Sync Android
        working-directory: project/apk
        run: npx cap sync android

      - name: Configure Android SDK and Java
        working-directory: project/apk/android
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          if [ -f gradle.properties ]; then
            sed -i '/^org\.gradle\.java\.home=/d' gradle.properties
          fi

      - name: Build APK
        working-directory: project/apk/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FLIPFALL-APK
          path: project/apk/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
